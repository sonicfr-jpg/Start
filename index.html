<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04061a"><title>SoNiC</title>
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{background:#04061a;color:#fff;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden}
.bd{position:fixed;inset:-50px;background:url(art.jpg) center/cover;filter:blur(40px) brightness(.34) saturate(1.3);z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.art{display:block;width:100%;border-radius:20px;box-shadow:0 14px 44px #000a,0 0 0 1px #6aa0ff30;margin-bottom:14px}
.clockbox{text-align:center;line-height:1;text-shadow:0 2px 12px #000a}#clock{font-size:64px;font-weight:200;letter-spacing:3px;font-variant-numeric:tabular-nums}
#date{margin-top:8px;font-size:16px;text-transform:capitalize;font-weight:500}#hello{margin-top:5px;font-size:12px;letter-spacing:2px;color:#ff7a45;font-weight:700;text-transform:uppercase}
form{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:25px;background:#ffffff18;border:1px solid #6aa0ff55;margin:16px 0 14px}
form:focus-within{border-color:#ff5a36}form span{font-size:21px;opacity:.85}input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px}input::placeholder{color:#ffffffb0}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:14px;text-decoration:none;color:#fff;background:#ffffff14;border:1px solid #6aa0ff30;font-size:11.5px;min-width:0}
.fav{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:inset 0 0 0 1px #ffffff40}
.nm{max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px;display:none;padding:0}.edit .x{display:block}
.add{background:transparent;border:1px dashed #ffffff66;font:inherit;color:#ffffffcc;cursor:pointer}.add .fav{font-size:28px;font-weight:300;box-shadow:none}
.tools{display:flex;justify-content:center;margin-top:14px}.tools button{background:none;border:1px solid #6aa0ff55;color:#cfe0ff;border-radius:18px;padding:6px 14px;font-size:12px}
dialog{border:1px solid #2f6db5;border-radius:14px;background:#0c1538;color:#eaf2ff;padding:18px;width:min(340px,92vw)}dialog::backdrop{background:#000a}
dialog h3{margin:0 0 10px;font-size:15px}dialog label{display:block;font-size:11px;letter-spacing:1px;color:#8ebfff;margin-bottom:10px}
dialog input{display:block;width:100%;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #2f6db5;background:#10264a;color:#fff;font-size:16px}
.btns{display:flex;justify-content:flex-end;gap:8px}.btns button{padding:9px 14px;border-radius:8px;border:1px solid #2f6db5;background:transparent;color:#eaf2ff}.btns .ok{background:#ff5a36;border-color:#ff5a36;font-weight:700}
@media (min-width:900px) and (min-aspect-ratio:1/1){.wrap{max-width:none;display:grid;grid-template-columns:minmax(380px,520px) minmax(0,640px);gap:40px;align-items:center;justify-content:center;min-height:100vh}.art{grid-column:2;grid-row:1/span 4}.clockbox,form,#tiles,.tools{grid-column:1}#clock{font-size:96px}}
</style></head>
<body><div class="bd"></div>
<div class="wrap" id="wrap">
 <img class="art" src="art.jpg" alt="">
 <section class="clockbox"><div id="clock">--:--</div><div id="date"></div><div id="hello"></div></section>
 <form id="f" autocomplete="off"><span>⌕</span><input id="q" type="search" enterkeyhint="search" spellcheck="false"></form>
 <section id="tiles"></section>
 <div class="tools"><button id="editBtn" type="button"></button></div>
</div>
<dialog id="dlg"><form method="dialog" id="af" style="display:block;border:0;background:none;padding:0;margin:0;height:auto"><h3 id="dT"></h3>
 <label><span id="lN"></span><input id="aN" required maxlength="24"></label><label><span id="lU"></span><input id="aU" required placeholder="example.com" inputmode="url"></label>
 <div class="btns"><button type="button" id="aC"></button><button class="ok" id="aOk"></button></div></form></dialog>
<script>
/* ===== Réglages faciles ===== */
const SEARCH_URL = "https://www.google.com/search?q=";          // ex. "https://duckduckgo.com/?q=" ou "https://www.bing.com/search?q="
const DEFAULT_TILES = [
  {title:"Claude", url:"https://claude.ai"},
  {title:"SoNiC",  url:"https://github.com/sonicfr-jpg/SoNiC"},
  {title:"YouTube",url:"https://www.youtube.com"},
  {title:"Gmail",  url:"https://mail.google.com"}
];
/* ============================ */
const FR = /^fr/i.test(navigator.language||"");
const T = FR ? {ph:"Rechercher ou saisir une adresse",add:"Ajouter",edit:"Modifier les raccourcis",done:"Terminé",nt:"Nouveau raccourci",name:"Nom",addr:"Adresse",cancel:"Annuler",g:["Bonne nuit","Bonjour","Bon après-midi","Bonsoir"]}
 : {ph:"Search or enter an address",add:"Add",edit:"Edit shortcuts",done:"Done",nt:"New shortcut",name:"Name",addr:"Address",cancel:"Cancel",g:["Good night","Good morning","Good afternoon","Good evening"]};
const $=id=>document.getElementById(id); document.documentElement.lang=FR?"fr":"en";
$("q").placeholder=T.ph; $("editBtn").textContent=T.edit; $("dT").textContent=T.nt; $("lN").textContent=T.name; $("lU").textContent=T.addr; $("aC").textContent=T.cancel; $("aOk").textContent=T.add;
function tick(){const d=new Date();$("clock").textContent=d.toLocaleTimeString(navigator.language,{hour:"2-digit",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString(navigator.language,{weekday:"long",day:"numeric",month:"long"});const h=d.getHours();$("hello").textContent=T.g[h<5?0:h<12?1:h<18?2:3];}
tick();setInterval(tick,10000);
$("f").addEventListener("submit",e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;
 if(/^(https?:\/\/)/i.test(q)||(/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(q)))location.href=/^https?:/i.test(q)?q:"https://"+q;else location.href=SEARCH_URL+encodeURIComponent(q);});
let editing=false;const KEY="sonicTiles";
const load=()=>{try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:DEFAULT_TILES}catch(e){return DEFAULT_TILES}};
const save=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
const COL=["#e8590c","#1c7ed6","#2f9e44","#9c36b5","#c2255c","#0c8599","#f08c00","#5f3dc4"];
function render(){const box=$("tiles"),list=load();box.replaceChildren();box.className=editing?"edit":"";$("wrap").classList.toggle("edit",editing);
 list.forEach((it,i)=>{const a=document.createElement("a");a.className="tile";a.href=it.url;
  const f=document.createElement("div");f.className="fav";f.textContent=(it.title||host(it.url))[0].toUpperCase();f.style.background=COL[[...host(it.url)].reduce((s,c)=>s+c.charCodeAt(0),0)%COL.length];
  const n=document.createElement("div");n.className="nm";n.textContent=it.title||host(it.url);a.append(f,n);
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();const l=load();l.splice(i,1);save(l);render();});a.appendChild(x);
  a.addEventListener("click",ev=>{if(editing)ev.preventDefault();});box.appendChild(a);});
 const add=document.createElement("button");add.type="button";add.className="tile add";const af=document.createElement("div");af.className="fav";af.textContent="+";const an=document.createElement("div");an.className="nm";an.textContent=T.add;add.append(af,an);
 add.addEventListener("click",()=>{$("af").reset();$("dlg").showModal();});box.appendChild(add);}
$("editBtn").addEventListener("click",()=>{editing=!editing;$("editBtn").textContent=editing?T.done:T.edit;render();});
$("aC").addEventListener("click",()=>$("dlg").close());
$("af").addEventListener("submit",e=>{let u=$("aU").value.trim();if(!/^[a-z]+:\/\//i.test(u))u="https://"+u;try{new URL(u)}catch(x){e.preventDefault();return}
 const l=load();l.push({title:$("aN").value.trim(),url:u});save(l);render();});
render();
</script></body></html>
